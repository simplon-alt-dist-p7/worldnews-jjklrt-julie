pre-commit:
  parallel: true
  jobs:
    - name: prettier fix
      glob: "*.{js,ts,jsx,tsx,json,md}"
      run: npx prettier --write {staged_files}

    - name: prettier check
      glob: "*.{js,ts,jsx,tsx,json,md}"
      run: npx prettier --check {staged_files}

    - name: run tests
      run: npm --prefix wn-jjklrt-write/write-front test

pre-push:
  jobs:
    - name: run tests
      run: npm --prefix wn-jjklrt-write/write-front test