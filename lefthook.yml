EXAMPLE USAGE:

  Refer for explanation to following link:
  https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files}

    - name: prettier
      glob: "*.{js,ts,jsx,tsx,json,md}"
      run: npx prettier --check {staged_files}

pre-push:
  jobs:
    - name: run tests
      run: npm test